<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarDex</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#d32f2f;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.search{
padding:20px;
text-align:center;
}

.search input{
width:90%;
max-width:500px;
padding:12px;
border:none;
border-radius:30px;
font-size:18px;
}

h2{
text-align:center;
margin:20px 0;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#222;
padding:25px;
border-radius:15px;
text-align:center;
font-size:20px;
transition:.3s;
cursor:pointer;
}

.card:hover{
background:#d32f2f;
}
</style>
</head>

<body>

<header>🚗 CarDex</header>

<div class="search">
<input type="text" placeholder="ابحث عن سيارة...">
</div>

<h2>الشركات</h2>

<div class="grid">
<div class="card">Mercedes</div>
<div class="card">BMW</div>
<div class="card">Audi</div>
<div class="card">Toyota</div>
<div class="card">Honda</div>
<div class="card">Hyundai</div>
<div class="card">Kia</div>
<div class="card">Porsche</div>
</div>

</body>
</html>
